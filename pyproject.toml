[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Telegram_Restricted_Media_Downloader"
authors = [{ name = "Gentlesprite", email = "Gentlesprites@outlook.com" }]
version = "0.2.263"
description = "Telegram downloader (TRMD): Supports resumable downloads and uploads. Bot supports commands/links for downloading, forwarding, listening, uploading, and upload-after-download of non-downloadable Telegram content via API."
readme = "README.md"
# 上界对齐 build.py 的 check_python_version()（明确拒绝 >=3.14）与 Dockerfile 的
# python:3.13。没有上界时 uv 会选中 3.14 并为它装 cp314 的 C 扩展；而 3.14 目前
# 只有 alpha 可用于本机场景，PyYAML 等扩展的 ABI 一旦不匹配就是 0xC0000005 硬崩，
# 表现为"测试/产品坏了"，排查成本极高。
requires-python = ">=3.13.2,<3.14"
license = "MIT"
dependencies = [
  "kurigram==2.2.19",
  "pygments>=2.19.2",
  "pymediainfo==7.0.1",
  "pyreadline3>=3.5.4",
  "pyyaml>=6.0.3",
  "qrcode>=8.2",
  "rich==14.2.0",
  "tgcrypto>=1.2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["module"]

[tool.pytest.ini_options]
# 测试文件命名为 *_case.py，而 pytest 默认只收集 test_*.py。
# 不补这一行时 `pytest unit_tests` 会收集 0 个用例并以退出码 5 结束，
# 导致 702 个用例与 architecture_guard_case.py 在默认流程中静默不执行。
testpaths = ["unit_tests"]
python_files = ["test_*.py", "*_test.py", "*_case.py"]
# 仓库根目录入 sys.path，使 `from unit_tests.pyrogram_stub import ...` 可用。
pythonpath = ["."]
# 只收集用例类，避免把 helper 类误当测试集。
python_classes = ["*Case", "Test*"]
addopts = "-ra"

[tool.uv]
package = true
