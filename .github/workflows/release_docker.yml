name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/asheblog/telegram_restricted_media_downloader

jobs:
  # 发布前必须先过测试：此前 Docker 镜像会在无任何测试的情况下直接发布。
  # 与 .github/workflows/ci.yml 同口径（uv sync --locked + pytest），tag 上再跑一次，
  # 防止通过 tag 绕过分支保护直接发布未测代码。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      # --locked（不是 --frozen）：只有前者会校验 uv.lock 与 pyproject 一致，见 ci.yml 注释。
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run test suite
        run: uv run --locked pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      # 1.检出代码。
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2.设置 Docker Buildx。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3.生成镜像标签。版本 tag 构建同时推版本号与 latest。
      - name: Resolve image tags
        shell: bash
        run: |
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      # 4.登录到 GitHub Container Registry。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5.先本地构建单平台镜像并**真的跑起来做冒烟检查**（在 push 之前）。
      #
      # 为什么必须加这一步：2026-10-03 的事故里，镜像构建成功、CI 全绿，
      # 但用户容器一启动就 `ImportError: cannot import name 'ChannelPrivate_400'`
      # （我把多行 import 压成单行时丢了 `as` 别名，而测试用的 pyrogram stub
      # 会伪造任意属性，所以测不出来）。"构建通过" ≠ "能启动"。
      - name: Build locally for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: trmd-smoke:local
          cache-from: type=gha

      # 6.在真实镜像里：① 确认用的是真 pyrogram（不是 stub）；② 导入整个 module 树；
      #   ③ 确认 WebUI 静态资源可用（模板已在构建期裁剪，只剩构建产物）。
      - name: Smoke test the built image (real import + assets)
        shell: bash
        run: |
          docker run --rm --entrypoint python trmd-smoke:local -c '
          import importlib, pathlib, sys
          sys.path.insert(0, "/app")
          import pyrogram
          pyro = getattr(pyrogram, "__file__", None)
          assert pyro and "site-packages" in pyro.replace("\\", "/"), f"stub detected: {pyro}"
          root = pathlib.Path("/app/module")
          mods = []
          for p in sorted(root.rglob("*.py")):
              if "__pycache__" in p.parts:
                  continue
              parts = list(p.relative_to("/app").with_suffix("").parts)
              if parts[-1] == "__init__":
                  parts.pop()
              mods.append(".".join(parts))
          failed = []
          for name in mods:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"IMPORTED {len(mods) - len(failed)}/{len(mods)}")
          for item in failed:
              print("FAILED: " + item)
          from module.adapters.webui import static_assets
          html = static_assets.WEB_UI_HTML
          assert html and len(html) > 1000, "WebUI 桌面页资源不可用（构建产物缺失？）"
          mobile = static_assets.WEB_UI_MOBILE_HTML
          assert mobile and len(mobile) > 1000, "WebUI 移动页资源不可用"
          login = static_assets.LOGIN_PAGE_HTML
          assert login and len(login) > 200, "WebUI 登录页资源不可用"
          print(f"ASSETS ok: desktop={len(html)} mobile={len(mobile)} login={len(login)} fonts={len(static_assets.font_names())}")
          sys.exit(1 if failed else 0)
          '

      # 7.冒烟通过后才构建并推送多平台镜像（复用上面的 GHA 层缓存）。
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
