name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/asheblog/telegram_restricted_media_downloader

jobs:
  # 发布前必须先过测试：此前 Docker 镜像会在无任何测试的情况下直接发布。
  # 与 tests.yml 同口径（uv sync --frozen + pytest），tag 上跑一次防止绕过分支保护。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run test suite
        run: uv run --frozen pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      # 1.检出代码。
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2.设置 Docker Buildx。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3.生成镜像标签。版本 tag 构建同时推版本号与 latest。
      - name: Resolve image tags
        shell: bash
        run: |
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      # 4.登录到 GitHub Container Registry。
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5.构建并推送镜像。
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
